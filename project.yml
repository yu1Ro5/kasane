name: KASANE
options:
  bundleIdPrefix: com.yu1Ro5
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 58Y7Q3D4A7
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO

targets:
  KASANE:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
        type: group
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yu1Ro5.kasane
        PRODUCT_NAME: KASANE
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRIVACY_MANIFEST_PATH: Sources/PrivacyInfo.xcprivacy
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/KASANE.entitlements
    scheme:
      testTargets:
        - KASANETests
        - KASANEUITests

  KASANETests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
        type: group
    dependencies:
      - target: KASANE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yu1Ro5.kasane.tests
        PRODUCT_NAME: KASANETests
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  KASANEUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
        type: group
    dependencies:
      - target: KASANE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yu1Ro5.kasane.uitests
        PRODUCT_NAME: KASANEUITests
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

schemes:
  KASANESmoke:
    build:
      targets:
        KASANE: all
        KASANETests: [test]
        KASANEUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: KASANETests
        - name: KASANEUITests
          selectedTests:
            - KASANEUISmokeTests/testAppLaunchSmoke()
            - KASANEUISmokeTests/testWorkoutHappyPathSmoke()
            - KASANEUISmokeTests/testWorkoutDraftPersistsAcrossNavigation()

  KASANEScreenshot:
    build:
      targets:
        KASANE: all
        KASANEUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: KASANEUITests
          selectedTests:
            - KASANEUIScreenshotTests/testEmptyScreenshots()
            - KASANEUIScreenshotTests/testOverviewScreenshots()
            - KASANEUIScreenshotTests/testWorkoutInteractionScreenshots()
            - KASANEUIScreenshotTests/testWorkoutValidationAndCompletionScreenshots()
            - KASANEUIScreenshotTests/testWorkoutHistoryScreenshots()

  KASANERegression:
    build:
      targets:
        KASANE: all
        KASANEUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: KASANEUITests
          selectedTests:
            - KASANEUIRegressionTests/testDataManagementNavigationAndActions()
            - KASANEUIRegressionTests/testOverviewRecentWorkoutOpensDetail()
            - KASANEUIRegressionTests/testOverviewSearchKeepsQueryAfterViewingDetail()
            - KASANEUIRegressionTests/testCompletedWorkoutDeletionFlow()
            - KASANEUIRegressionTests/testWorkoutRepSuggestionsApplyToFocusedInput()
            - KASANEUIRegressionTests/testWorkoutCompletionWithoutImprovementOmitsInsight()
            - KASANEUIRegressionTests/testWorkoutAIQuickInputReviewAndApply()
            - KASANEUIRegressionTests/testWorkoutAIQuickInputAddsSetBeforeApply()
            - KASANEUIRegressionTests/testWorkoutAIQuickInputAddsExerciseBeforeApply()
            - KASANEUIRegressionTests/testWorkoutAIQuickInputShowsClassifiedError()
            - KASANEUIRegressionTests/testOverviewPreviousMonthNavigation()
            - KASANEUIRegressionTests/testWorkoutCompletionInsightAppears()
            - KASANEUIRegressionTests/testPersonalRecordCompletionNavigation()
            - KASANEUIRegressionTests/testWorkoutPreviousRecordState()

  KASANEVisualEdgeCases:
    build:
      targets:
        KASANE: all
        KASANEUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: KASANEUITests
          selectedTests:
            - KASANEUIVisualEdgeCaseTests/testAboutScreenshot()
            - KASANEUIVisualEdgeCaseTests/testOverviewUnavailableInsightScreenshot()
            - KASANEUIVisualEdgeCaseTests/testOverviewDarkModeScreenshot()
            - KASANEUIVisualEdgeCaseTests/testOverviewDynamicTypeScreenshot()
            - KASANEUIVisualEdgeCaseTests/testWorkoutDynamicTypeScreenshot()
