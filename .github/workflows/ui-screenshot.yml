name: UI Screenshot

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture-screenshot:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6

      - name: Select Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcode_path="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' | sort | tail -1)"
          test -n "$xcode_path"
          sudo xcode-select --switch "$xcode_path"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select and boot 6.9-inch iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_total_start="$(date +%s)"
          echo "started_at=$simulator_total_start" >> "$GITHUB_OUTPUT"
          simulator_search_start="$(date +%s)"
          simulator="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          preferred_names = ("iPhone 18 Pro Max", "iPhone 17 Pro Max")
          for preferred_name in preferred_names:
              for runtime in sorted(devices, reverse=True):
                  if "iOS-27" not in runtime:
                      continue
                  for device in devices[runtime]:
                      if device["isAvailable"] and device["name"] == preferred_name:
                          print(device["udid"])
                          print(device["name"], file=sys.stderr)
                          raise SystemExit
          raise SystemExit(
              "No available 6.9-inch iOS 27 simulator found "
              "(expected iPhone 18 Pro Max or iPhone 17 Pro Max)"
          )
          ')"
          simulator_search_end="$(date +%s)"
          simulator_info="$(xcrun simctl list devices --json | python3 -c '
          import json, sys
          target = sys.argv[1]
          device = next(
              device
              for values in json.load(sys.stdin)["devices"].values()
              for device in values
              if device["udid"] == target
          )
          print("{}\t{}".format(device["name"], device["state"]))
          ' "$simulator")"
          IFS=$'\t' read -r simulator_name simulator_state <<< "$simulator_info"
          echo "id=$simulator" >> "$GITHUB_OUTPUT"
          echo "name=$simulator_name" >> "$GITHUB_OUTPUT"
          simulator_boot_start="$(date +%s)"
          echo "boot_started_at=$simulator_boot_start" >> "$GITHUB_OUTPUT"
          echo "Simulator boot requested at $(date -u +%FT%TZ) (epoch=$simulator_boot_start, initial_state=$simulator_state)"
          case "$simulator_state" in
            Shutdown)
              xcrun simctl boot "$simulator"
              ;;
            Booted)
              ;;
            *)
              echo "Simulator $simulator is in unexpected state: $simulator_state" >&2
              exit 1
              ;;
          esac
          simulator_boot_command_end="$(date +%s)"
          {
            echo "search_seconds=$((simulator_search_end - simulator_search_start))"
            echo "boot_command_seconds=$((simulator_boot_command_end - simulator_boot_start))"
          } >> "$GITHUB_OUTPUT"

          # Observe readiness during the build; the foreground check below gates UI tests.
          # Redirect all descriptors so the observer can outlive this step.
          rm -f "$RUNNER_TEMP/simulator-ready-at" "$RUNNER_TEMP/simulator-ready-at.tmp"
          # shellcheck disable=SC2016 # The observer expands its own positional parameters.
          nohup bash -c '
            if xcrun simctl bootstatus "$1" -b; then
              date +%s > "$2/simulator-ready-at.tmp"
              mv "$2/simulator-ready-at.tmp" "$2/simulator-ready-at"
            else
              echo "::warning::Simulator readiness observer failed; foreground bootstatus will verify readiness"
            fi
          ' _ "$simulator" "$RUNNER_TEMP" > "$RUNNER_TEMP/simulator-boot.log" 2>&1 < /dev/null &

      - name: Build UI screenshot tests for testing
        id: build_for_testing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild_start="$(date +%s)"
          echo "started_at=$xcodebuild_start" >> "$GITHUB_OUTPUT"
          echo "xcodebuild started at $(date -u +%FT%TZ) (epoch=$xcodebuild_start)"
          xcodebuild -project KASANE.xcodeproj \
            -scheme KASANEScreenshot \
            -only-testing:KASANEUITests/KASANEUIScreenshotTests/testPrimaryScreenshots \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath build \
            -configuration Debug \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
          xcodebuild_end="$(date +%s)"
          echo "finished_at=$xcodebuild_end" >> "$GITHUB_OUTPUT"
          echo "xcodebuild finished at $(date -u +%FT%TZ) (epoch=$xcodebuild_end)"
          echo "total_seconds=$((xcodebuild_end - xcodebuild_start))" >> "$GITHUB_OUTPUT"

      - name: Wait for simulator boot
        id: simulator_ready
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          wait_start="$(date +%s)"
          trap 'echo "Simulator wait ended at $(date -u +%FT%TZ)"; cat "$RUNNER_TEMP/simulator-boot.log"' EXIT
          xcrun simctl bootstatus "${{ steps.simulator.outputs.id }}" -b
          ready_confirmed_at="$(date +%s)"
          {
            echo "confirmed_at=$ready_confirmed_at"
            echo "wait_seconds=$((ready_confirmed_at - wait_start))"
            echo "ready_elapsed_seconds=$((ready_confirmed_at - ${{ steps.simulator.outputs.boot_started_at }}))"
          } >> "$GITHUB_OUTPUT"
          echo "Simulator readiness confirmed at $(date -u +%FT%TZ) (epoch=$ready_confirmed_at)"
          if [[ -f "$RUNNER_TEMP/simulator-ready-at" ]]; then
            observed_at="$(cat "$RUNNER_TEMP/simulator-ready-at")"
            echo "observed_at=$observed_at" >> "$GITHUB_OUTPUT"
            echo "observed_elapsed_seconds=$((observed_at - ${{ steps.simulator.outputs.boot_started_at }}))" >> "$GITHUB_OUTPUT"
            echo "Simulator readiness observed at epoch=$observed_at; compare with build started_at/finished_at and xcodebuild logs"
          fi

      - name: Run UI screenshot tests without building
        id: test
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild_start="$(date +%s)"
          echo "started_at=$xcodebuild_start" >> "$GITHUB_OUTPUT"
          echo "xcodebuild started at $(date -u +%FT%TZ) (epoch=$xcodebuild_start)"
          xcodebuild -project KASANE.xcodeproj \
            -scheme KASANEScreenshot \
            -only-testing:KASANEUITests/KASANEUIScreenshotTests/testPrimaryScreenshots \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath build \
            -resultBundlePath "$RUNNER_TEMP/ui-screenshots.xcresult" \
            -configuration Debug \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO \
            -collect-test-diagnostics never \
            test-without-building
          xcodebuild_end="$(date +%s)"
          echo "finished_at=$xcodebuild_end" >> "$GITHUB_OUTPUT"
          echo "xcodebuild finished at $(date -u +%FT%TZ) (epoch=$xcodebuild_end)"
          xctest_reported_seconds="$(
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/ui-screenshots.xcresult" \
              --format json | python3 -c '
          import json
          import sys

          summary = json.load(sys.stdin)
          duration = summary["finishTime"] - summary["startTime"]
          print(f"{duration:.3f}")
          '
          )"
          {
            echo "total_seconds=$((xcodebuild_end - xcodebuild_start))"
            echo "xctest_reported_seconds=$xctest_reported_seconds"
          } >> "$GITHUB_OUTPUT"

      - name: Extract screenshot and metadata
        id: extract
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SIMULATOR_NAME: ${{ steps.simulator.outputs.name }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/ui-screenshot-artifact"
          export_dir="$RUNNER_TEMP/ui-screenshot-attachments"
          mkdir -p "$artifact_dir"
          mkdir -p "$export_dir"
          screenshot_export_start="$(date +%s)"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/ui-screenshots.xcresult" \
            --output-path "$export_dir"
          screenshot_export_end="$(date +%s)"
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          export_dir = runner_temp / "ui-screenshot-attachments"
          scenarios = [
              ("overview-dashboard", "Overview — Dashboard"),
              ("workout-history", "Workout — History"),
              ("workout-detail", "Workout — Detail"),
              ("workout-smart-start-history", "Workout — Smart Start"),
              ("workout-exercise-input", "Workout — Exercise Input"),
          ]
          artifact_dir = runner_temp / "ui-screenshot-artifact"
          manifest = json.loads((export_dir / "manifest.json").read_text())
          attachments = [
              attachment
              for test in manifest
              for attachment in test.get("attachments", [])
          ]
          metadata_screenshots = []
          for result_name, display_name in scenarios:
              matches = [
                  attachment
                  for attachment in attachments
                  if isinstance(attachment.get("suggestedHumanReadableName"), str)
                  and attachment["suggestedHumanReadableName"].startswith(f"{result_name}_")
                  and attachment["suggestedHumanReadableName"].endswith(".png")
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one PNG attachment for {result_name}, "
                      f"found {len(matches)}."
                  )
              exported_file = matches[0].get("exportedFileName")
              if not isinstance(exported_file, str) or Path(exported_file).name != exported_file:
                  raise SystemExit(f"Invalid exported attachment path for {result_name}.")
              source = (export_dir / exported_file).resolve()
              if source.parent != export_dir.resolve() or not source.is_file():
                  raise SystemExit(f"Exported attachment is missing for {result_name}.")
              filename = f"{result_name}.png"
              shutil.copyfile(source, artifact_dir / filename)
              metadata_screenshots.append({"name": display_name, "file": filename})

          metadata = {
              "pr_number": int(os.environ["PR_NUMBER"]),
              "head_sha": os.environ["HEAD_SHA"],
              "simulator": os.environ["SIMULATOR_NAME"],
              "ios": "27.x",
              "screenshots": metadata_screenshots,
          }
          path = artifact_dir / "metadata.json"
          path.write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + "\n")
          PY
          screenshot_count="$(find "$artifact_dir" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          {
            echo "export_seconds=$((screenshot_export_end - screenshot_export_start))"
            echo "screenshot_count=$screenshot_count"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize UI screenshot timings
        if: always()
        shell: bash
        run: |
          main_elapsed=n/a
          if [[ -n "${{ steps.simulator.outputs.started_at }}" && -n "${{ steps.test.outputs.finished_at }}" ]]; then
            main_elapsed="$(( ${{ steps.test.outputs.finished_at || '0' }} - ${{ steps.simulator.outputs.started_at || '0' }} ))"
          fi
          {
            echo "## UI Screenshot Timing"
            echo
            echo "Timestamps below are Unix seconds (UTC). Readiness observation may be unavailable if the observer has not completed or failed; confirmation is an upper bound on readiness."
            echo
            echo "| Event | Timestamp |"
            echo "| --- | ---: |"
            echo "| Simulator boot requested | ${{ steps.simulator.outputs.boot_started_at || 'n/a' }} |"
            echo "| Simulator ready observed | ${{ steps.simulator_ready.outputs.observed_at || 'n/a' }} |"
            echo "| Simulator ready confirmed | ${{ steps.simulator_ready.outputs.confirmed_at || 'n/a' }} |"
            echo "| Build started | ${{ steps.build_for_testing.outputs.started_at || 'n/a' }} |"
            echo "| Build finished | ${{ steps.build_for_testing.outputs.finished_at || 'n/a' }} |"
            echo
            echo "| 区間 | 秒 |"
            echo "| --- | ---: |"
            echo "| Simulator検索 | ${{ steps.simulator.outputs.search_seconds || 'n/a' }} |"
            echo "| Simulator起動コマンド | ${{ steps.simulator.outputs.boot_command_seconds || 'n/a' }} |"
            echo "| Simulator起動から準備完了観測 | ${{ steps.simulator_ready.outputs.observed_elapsed_seconds || 'n/a' }} |"
            echo "| Simulator起動から準備完了確認（上限） | ${{ steps.simulator_ready.outputs.ready_elapsed_seconds || 'n/a' }} |"
            echo "| ビルド後のSimulator待機 | ${{ steps.simulator_ready.outputs.wait_seconds || 'n/a' }} |"
            echo "| 主要工程の実経過（Simulator検索開始〜UIテスト終了） | $main_elapsed |"
            echo "| build-for-testing | ${{ steps.build_for_testing.outputs.total_seconds || 'n/a' }} |"
            echo "| test-without-building | ${{ steps.test.outputs.total_seconds || 'n/a' }} |"
            echo "| XCTest reported duration | ${{ steps.test.outputs.xctest_reported_seconds || 'n/a' }} |"
            echo "| xcresult screenshot export | ${{ steps.extract.outputs.export_seconds || 'n/a' }} |"
            echo "| Screenshot枚数 | ${{ steps.extract.outputs.screenshot_count || 'n/a' }} |"
            echo
            echo "Overlapping durations are not summed. Compare readiness observation with build timestamps and xcodebuild logs to assess overlap/internal waiting; CPU and memory contention may increase build duration."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload simulator boot diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshot-simulator-boot
          path: ${{ runner.temp }}/simulator-boot.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload xcresult
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshot-xcresult
          path: ${{ runner.temp }}/*.xcresult
          retention-days: 7

      - name: Upload UI screenshot
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshot-review
          path: ${{ runner.temp }}/ui-screenshot-artifact
          if-no-files-found: error
          retention-days: 7
