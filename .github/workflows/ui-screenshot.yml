name: UI Screenshot

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture-screenshot:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - group: overview-history
            test-selectors: >-
              -only-testing:KASANEUITests/KASANEUIScreenshotTests/testOverviewEmptyScreenshot
              -only-testing:KASANEUITests/KASANEUIScreenshotTests/testOverviewRecentWorkoutsScreenshot
              -only-testing:KASANEUITests/KASANEUIScreenshotTests/testWorkoutHistoryScreenshots
            scenarios: overview-empty,overview-recent-workouts,workout-history,workout-detail,workout-detail-edit-mode
          - group: workout
            test-selectors: >-
              -only-testing:KASANEUITests/KASANEUIScreenshotTests/testWorkoutRootEmptyScreenshot
              -only-testing:KASANEUITests/KASANEUIScreenshotTests/testWorkoutScreenshots
              -only-testing:KASANEUITests/KASANEUIScreenshotTests/testWorkoutCompletedScreenshot
            scenarios: workout-root-empty,workout-root-active,workout-weight-input,exercise-picker,workout-cancel-confirmation,workout-completed

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          xcode_path="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -1)"
          test -n "$xcode_path"
          sudo xcode-select --switch "$xcode_path"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS-26" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["isAvailable"] and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      print(device["name"], file=sys.stderr)
                      raise SystemExit
          raise SystemExit("No available iOS 26 iPhone simulator found")
          ')"
          simulator_info="$(xcrun simctl list devices --json | python3 -c '
          import json, sys
          target = sys.argv[1]
          device = next(
              device
              for values in json.load(sys.stdin)["devices"].values()
              for device in values
              if device["udid"] == target
          )
          print("{}\t{}".format(device["name"], device["state"]))
          ' "$simulator")"
          IFS=$'\t' read -r simulator_name simulator_state <<< "$simulator_info"
          echo "id=$simulator" >> "$GITHUB_OUTPUT"
          echo "name=$simulator_name" >> "$GITHUB_OUTPUT"
          case "$simulator_state" in
            Shutdown)
              xcrun simctl boot "$simulator"
              ;;
            Booted)
              ;;
            *)
              echo "Simulator $simulator is in unexpected state: $simulator_state" >&2
              exit 1
              ;;
          esac

      - name: Run UI screenshot tests
        shell: bash
        env:
          TEST_SELECTORS: ${{ matrix.test-selectors }}
        run: |
          set -euo pipefail
          read -r -a selectors <<< "$TEST_SELECTORS"
          xcodebuild -project KASANE.xcodeproj \
            -scheme KASANEScreenshot \
            "${selectors[@]}" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath build \
            -resultBundlePath "$RUNNER_TEMP/ui-screenshots.xcresult" \
            -configuration Debug \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Extract screenshots
        shell: bash
        env:
          SCENARIOS: ${{ matrix.scenarios }}
          SIMULATOR_NAME: ${{ steps.simulator.outputs.name }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/ui-screenshot-artifact"
          export_dir="$RUNNER_TEMP/ui-screenshot-attachments"
          mkdir -p "$artifact_dir" "$export_dir"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/ui-screenshots.xcresult" \
            --output-path "$export_dir"
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          export_dir = runner_temp / "ui-screenshot-attachments"
          artifact_dir = runner_temp / "ui-screenshot-artifact"
          scenarios = os.environ["SCENARIOS"].split(",")
          manifest = json.loads((export_dir / "manifest.json").read_text())
          attachments = [
              attachment
              for test in manifest
              for attachment in test.get("attachments", [])
          ]
          for result_name in scenarios:
              matches = [
                  attachment
                  for attachment in attachments
                  if isinstance(attachment.get("suggestedHumanReadableName"), str)
                  and attachment["suggestedHumanReadableName"].startswith(f"{result_name}_")
                  and attachment["suggestedHumanReadableName"].endswith(".png")
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one PNG attachment for {result_name}, "
                      f"found {len(matches)}."
                  )
              exported_file = matches[0].get("exportedFileName")
              if not isinstance(exported_file, str) or Path(exported_file).name != exported_file:
                  raise SystemExit(f"Invalid exported attachment path for {result_name}.")
              source = (export_dir / exported_file).resolve()
              if source.parent != export_dir.resolve() or not source.is_file():
                  raise SystemExit(f"Exported attachment is missing for {result_name}.")
              shutil.copyfile(source, artifact_dir / f"{result_name}.png")

          (artifact_dir / f"simulator-{os.environ['SIMULATOR_NAME']}.txt").touch()
          PY

      - name: Upload xcresult
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshot-xcresult-${{ matrix.group }}
          path: ${{ runner.temp }}/*.xcresult
          retention-days: 7

      - name: Upload screenshot group
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshot-${{ matrix.group }}
          path: ${{ runner.temp }}/ui-screenshot-artifact
          if-no-files-found: error
          retention-days: 1

  consolidate-screenshots:
    needs: capture-screenshot
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Download screenshot groups
        uses: actions/download-artifact@v6
        with:
          pattern: ui-screenshot-*
          path: ${{ runner.temp }}/ui-screenshot-artifact
          merge-multiple: true

      - name: Validate and create metadata
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact_dir = Path(os.environ["RUNNER_TEMP"]) / "ui-screenshot-artifact"
          scenarios = [
              ("overview-empty", "Overview — Empty"),
              ("overview-recent-workouts", "Overview — Recent Workouts"),
              ("workout-root-empty", "Workout — Empty"),
              ("workout-root-active", "Workout — Active"),
              ("workout-weight-input", "Workout — Weight Input"),
              ("exercise-picker", "Workout — Exercise Picker"),
              ("workout-cancel-confirmation", "Workout — Cancel Confirmation"),
              ("workout-history", "Workout — History"),
              ("workout-detail", "Workout — Detail"),
              ("workout-detail-edit-mode", "Workout — Detail Edit Mode"),
              ("workout-completed", "Workout — Completed"),
          ]
          expected = {f"{name}.png" for name, _ in scenarios}
          actual = {path.name for path in artifact_dir.glob("*.png")}
          if actual != expected:
              raise SystemExit(f"Screenshot set mismatch: expected {expected}, found {actual}")
          simulator_files = list(artifact_dir.glob("simulator-*.txt"))
          if not simulator_files:
              raise SystemExit("Simulator metadata is missing")
          simulators = sorted({path.stem.removeprefix("simulator-") for path in simulator_files})
          for path in simulator_files:
              path.unlink()
          metadata = {
              "pr_number": int(os.environ["PR_NUMBER"]),
              "head_sha": os.environ["HEAD_SHA"],
              "simulator": ", ".join(simulators),
              "ios": "26.x",
              "screenshots": [
                  {"name": display_name, "file": f"{result_name}.png"}
                  for result_name, display_name in scenarios
              ],
          }
          (artifact_dir / "metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n"
          )
          PY

      - name: Upload UI screenshot
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshot-review
          path: ${{ runner.temp }}/ui-screenshot-artifact
          if-no-files-found: error
          retention-days: 7
