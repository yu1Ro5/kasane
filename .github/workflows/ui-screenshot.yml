name: UI Screenshot

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture-screenshot:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6

      - name: Select Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcode_path="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' | sort | tail -1)"
          test -n "$xcode_path"
          sudo xcode-select --switch "$xcode_path"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare compilation cache identity
        id: cache_identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCACHE'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          identity = {
              "xcode": subprocess.check_output(["xcodebuild", "-version"], text=True).strip(),
              "swift": subprocess.check_output(["xcrun", "swift", "--version"], text=True).strip(),
              "sdk_build": subprocess.check_output(["xcrun", "--sdk", "iphonesimulator", "--show-sdk-build-version"], text=True).strip(),
              "architecture": platform.machine(),
              "project": hashlib.sha256(Path("project.yml").read_bytes()).hexdigest(),
              "configuration": "KASANEScreenshot-Debug-coverage-NO-signing-NO",
          }
          fingerprint = hashlib.sha256(json.dumps(identity, sort_keys=True).encode()).hexdigest()
          prefix = f"ui-screenshot-cas-v1-{fingerprint}-"
          identity["source_sha"] = os.environ["GITHUB_SHA"]
          Path(os.environ["RUNNER_TEMP"], "ui-screenshot-cache-identity.json").write_text(json.dumps(identity, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"prefix={prefix}\nkey={prefix}{os.environ['GITHUB_SHA']}\n")
          print(json.dumps(identity, indent=2))
          PYCACHE
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Restore screenshot compilation cache
        id: cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ui-screenshot-compilation-cache
          key: ${{ steps.cache_identity.outputs.key }}
          restore-keys: ${{ steps.cache_identity.outputs.prefix }}

      - name: Record cache restore timing
        id: cache_restore_timing
        shell: bash
        run: |
          echo "total_seconds=$(( $(date +%s) - ${{ steps.cache_identity.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

      - name: Select and boot 6.9-inch iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_total_start="$(date +%s)"
          simulator_search_start="$(date +%s)"
          simulator="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          preferred_names = ("iPhone 18 Pro Max", "iPhone 17 Pro Max")
          for preferred_name in preferred_names:
              for runtime in sorted(devices, reverse=True):
                  if "iOS-27" not in runtime:
                      continue
                  for device in devices[runtime]:
                      if device["isAvailable"] and device["name"] == preferred_name:
                          print(device["udid"])
                          print(device["name"], file=sys.stderr)
                          raise SystemExit
          raise SystemExit(
              "No available 6.9-inch iOS 27 simulator found "
              "(expected iPhone 18 Pro Max or iPhone 17 Pro Max)"
          )
          ')"
          simulator_search_end="$(date +%s)"
          simulator_info="$(xcrun simctl list devices --json | python3 -c '
          import json, sys
          target = sys.argv[1]
          device = next(
              device
              for values in json.load(sys.stdin)["devices"].values()
              for device in values
              if device["udid"] == target
          )
          print("{}\t{}".format(device["name"], device["state"]))
          ' "$simulator")"
          IFS=$'\t' read -r simulator_name simulator_state <<< "$simulator_info"
          echo "id=$simulator" >> "$GITHUB_OUTPUT"
          echo "name=$simulator_name" >> "$GITHUB_OUTPUT"
          simulator_boot_start="$(date +%s)"
          case "$simulator_state" in
            Shutdown)
              xcrun simctl boot "$simulator"
              ;;
            Booted)
              ;;
            *)
              echo "Simulator $simulator is in unexpected state: $simulator_state" >&2
              exit 1
              ;;
          esac
          xcrun simctl bootstatus "$simulator" -b
          simulator_boot_end="$(date +%s)"

          simulator_total_end="$(date +%s)"

          {
            echo "search_seconds=$((simulator_search_end - simulator_search_start))"
            echo "first_boot_seconds=$((simulator_boot_end - simulator_boot_start))"
            echo "locale_seconds=0"
            echo "restart_seconds=0"
            echo "total_seconds=$((simulator_total_end - simulator_total_start))"
          } >> "$GITHUB_OUTPUT"

      - name: Build UI screenshot tests for testing
        id: build_for_testing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild_start="$(date +%s)"
          xcodebuild -project KASANE.xcodeproj \
            -scheme KASANEScreenshot \
            -only-testing:KASANEUITests/KASANEUIScreenshotTests/testPrimaryScreenshots \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath build \
            -configuration Debug \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/ui-screenshot-compilation-cache" \
            -showBuildTimingSummary \
            build-for-testing 2>&1 | tee "$RUNNER_TEMP/ui-screenshot-build.log"
          xcodebuild_end="$(date +%s)"
          echo "total_seconds=$((xcodebuild_end - xcodebuild_start))" >> "$GITHUB_OUTPUT"
          python3 - <<'PYCACHE'
          import os
          from pathlib import Path
          lines = Path(os.environ["RUNNER_TEMP"], "ui-screenshot-build.log").read_text().splitlines()
          hits = sum("note: replay cache hit" in line for line in lines)
          misses = sum("note: replay cache miss" in line for line in lines)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"replay_hits={hits}\nreplay_misses={misses}\n")
          PYCACHE

      - name: Run UI screenshot tests without building
        id: test
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild_start="$(date +%s)"
          xcodebuild -project KASANE.xcodeproj \
            -scheme KASANEScreenshot \
            -only-testing:KASANEUITests/KASANEUIScreenshotTests/testPrimaryScreenshots \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath build \
            -resultBundlePath "$RUNNER_TEMP/ui-screenshots.xcresult" \
            -configuration Debug \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO \
            -collect-test-diagnostics never \
            test-without-building
          xcodebuild_end="$(date +%s)"
          xctest_reported_seconds="$(
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/ui-screenshots.xcresult" \
              --format json | python3 -c '
          import json
          import sys

          summary = json.load(sys.stdin)
          duration = summary["finishTime"] - summary["startTime"]
          print(f"{duration:.3f}")
          '
          )"
          {
            echo "total_seconds=$((xcodebuild_end - xcodebuild_start))"
            echo "xctest_reported_seconds=$xctest_reported_seconds"
          } >> "$GITHUB_OUTPUT"

      - name: Extract screenshot and metadata
        id: extract
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SIMULATOR_NAME: ${{ steps.simulator.outputs.name }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/ui-screenshot-artifact"
          export_dir="$RUNNER_TEMP/ui-screenshot-attachments"
          mkdir -p "$artifact_dir"
          mkdir -p "$export_dir"
          screenshot_export_start="$(date +%s)"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/ui-screenshots.xcresult" \
            --output-path "$export_dir"
          screenshot_export_end="$(date +%s)"
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          export_dir = runner_temp / "ui-screenshot-attachments"
          scenarios = [
              ("overview-dashboard", "Overview — Dashboard"),
              ("workout-history", "Workout — History"),
              ("workout-detail", "Workout — Detail"),
              ("workout-smart-start-history", "Workout — Smart Start"),
              ("workout-exercise-input", "Workout — Exercise Input"),
          ]
          artifact_dir = runner_temp / "ui-screenshot-artifact"
          manifest = json.loads((export_dir / "manifest.json").read_text())
          attachments = [
              attachment
              for test in manifest
              for attachment in test.get("attachments", [])
          ]
          metadata_screenshots = []
          for result_name, display_name in scenarios:
              matches = [
                  attachment
                  for attachment in attachments
                  if isinstance(attachment.get("suggestedHumanReadableName"), str)
                  and attachment["suggestedHumanReadableName"].startswith(f"{result_name}_")
                  and attachment["suggestedHumanReadableName"].endswith(".png")
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one PNG attachment for {result_name}, "
                      f"found {len(matches)}."
                  )
              exported_file = matches[0].get("exportedFileName")
              if not isinstance(exported_file, str) or Path(exported_file).name != exported_file:
                  raise SystemExit(f"Invalid exported attachment path for {result_name}.")
              source = (export_dir / exported_file).resolve()
              if source.parent != export_dir.resolve() or not source.is_file():
                  raise SystemExit(f"Exported attachment is missing for {result_name}.")
              filename = f"{result_name}.png"
              shutil.copyfile(source, artifact_dir / filename)
              metadata_screenshots.append({"name": display_name, "file": filename})

          metadata = {
              "pr_number": int(os.environ["PR_NUMBER"]),
              "head_sha": os.environ["HEAD_SHA"],
              "simulator": os.environ["SIMULATOR_NAME"],
              "ios": "27.x",
              "screenshots": metadata_screenshots,
          }
          path = artifact_dir / "metadata.json"
          path.write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + "\n")
          PY
          screenshot_count="$(find "$artifact_dir" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          {
            echo "export_seconds=$((screenshot_export_end - screenshot_export_start))"
            echo "screenshot_count=$screenshot_count"
          } >> "$GITHUB_OUTPUT"

      - name: Start compilation cache save timer
        id: cache_save_start
        if: steps.cache_restore.outputs.cache-hit != 'true'
        shell: bash
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Save screenshot compilation cache
        if: steps.cache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ui-screenshot-compilation-cache
          key: ${{ steps.cache_identity.outputs.key }}

      - name: Record cache save timing
        id: cache_save_timing
        if: steps.cache_restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "total_seconds=$(( $(date +%s) - ${{ steps.cache_save_start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

      - name: Summarize UI screenshot timings
        if: always()
        shell: bash
        run: |
          {
            echo "## UI Screenshot Timing"
            echo
            echo "| 区間 | 秒 |"
            echo "| --- | ---: |"
            echo "| Simulator検索 | ${{ steps.simulator.outputs.search_seconds || 'n/a' }} |"
            echo "| Simulator初回boot | ${{ steps.simulator.outputs.first_boot_seconds || 'n/a' }} |"
            echo "| 日本語／locale設定 | ${{ steps.simulator.outputs.locale_seconds || 'n/a' }} |"
            echo "| Simulator再起動 | ${{ steps.simulator.outputs.restart_seconds || 'n/a' }} |"
            echo "| Simulator合計 | ${{ steps.simulator.outputs.total_seconds || 'n/a' }} |"
            echo "| Compiler cache restore | ${{ steps.cache_restore_timing.outputs.total_seconds || 'n/a' }} |"
            echo "| Compiler cache save (skipped on exact key hit) | ${{ steps.cache_save_timing.outputs.total_seconds || 'n/a' }} |"
            echo "| build-for-testing | ${{ steps.build_for_testing.outputs.total_seconds || 'n/a' }} |"
            echo "| test-without-building | ${{ steps.test.outputs.total_seconds || 'n/a' }} |"
            echo "| XCTest reported duration | ${{ steps.test.outputs.xctest_reported_seconds || 'n/a' }} |"
            echo "| xcresult screenshot export | ${{ steps.extract.outputs.export_seconds || 'n/a' }} |"
            echo "| Screenshot枚数 | ${{ steps.extract.outputs.screenshot_count || 'n/a' }} |"
            echo
            echo "Compiler cache exact key hit: ${{ steps.cache_restore.outputs.cache-hit || 'false' }}"
            echo "Compiler replay hit remarks: ${{ steps.build_for_testing.outputs.replay_hits || 'n/a' }}"
            echo "Compiler replay miss remarks: ${{ steps.build_for_testing.outputs.replay_misses || 'n/a' }}"
            echo "An exact key miss may restore a compatible earlier source revision. The current source is always built."
            echo "Replay counts are diagnostic remarks, not a hit rate. Cache timings include action/step overhead."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compilation cache diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshot-compilation-diagnostics
          path: |
            ${{ runner.temp }}/ui-screenshot-build.log
            ${{ runner.temp }}/ui-screenshot-cache-identity.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload xcresult
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshot-xcresult
          path: ${{ runner.temp }}/*.xcresult
          retention-days: 7

      - name: Upload UI screenshot
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshot-review
          path: ${{ runner.temp }}/ui-screenshot-artifact
          if-no-files-found: error
          retention-days: 7
