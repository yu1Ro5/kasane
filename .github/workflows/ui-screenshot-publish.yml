name: Publish UI Screenshot

on:
  workflow_run:
    workflows: [UI Screenshot]
    types: [completed]

concurrency:
  group: ui-screenshot-publish
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  publish-screenshot:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Resolve associated pull request
        uses: actions/github-script@v9
        with:
          script: |
            const pullRequests = context.payload.workflow_run.pull_requests ?? [];
            if (pullRequests.length === 0) {
              core.setFailed('No pull request associated with this workflow_run');
              return;
            }
            core.exportVariable('EXPECTED_PR_NUMBER', String(pullRequests[0].number));

      - name: Download screenshot artifact
        uses: actions/download-artifact@v6
        with:
          name: ui-screenshot-review
          path: ${{ runner.temp }}/ui-screenshot-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate untrusted artifact
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/ui-screenshot-artifact
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected_screenshot_count = 16
          root = Path(os.environ["ARTIFACT_DIR"]).resolve()
          files = [path for path in root.rglob("*") if path.is_file()]
          if not files:
              raise SystemExit("Artifact is empty")
          if any(path.parent != root for path in files):
              raise SystemExit("Nested artifact paths are not allowed")
          if any(path.is_symlink() for path in root.rglob("*")):
              raise SystemExit("Artifact symlinks are not allowed")

          metadata_path = root / "metadata.json"
          if not metadata_path.is_file():
              raise SystemExit("Artifact metadata.json is missing")
          metadata = json.loads(metadata_path.read_text())
          if metadata.get("head_sha") != os.environ["EXPECTED_HEAD_SHA"]:
              raise SystemExit("Artifact head SHA does not match workflow_run")
          if metadata.get("pr_number") != int(os.environ["EXPECTED_PR_NUMBER"]):
              raise SystemExit("Artifact PR number does not match workflow_run")

          screenshots = metadata.get("screenshots")
          if not isinstance(screenshots, list) or len(screenshots) != expected_screenshot_count:
              raise SystemExit(
                  f"Artifact must describe exactly {expected_screenshot_count} screenshots"
              )
          expected_files = {"metadata.json"}
          for screenshot in screenshots:
              name, filename = screenshot.get("name"), screenshot.get("file")
              if not isinstance(name, str) or not name or len(name) > 100:
                  raise SystemExit("Invalid screenshot name")
              if not isinstance(filename, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*\.png", filename):
                  raise SystemExit("Invalid screenshot filename")
              if ".." in filename or Path(filename).name != filename:
                  raise SystemExit("Screenshot path traversal is not allowed")
              path = (root / filename).resolve()
              if path.parent != root or not path.is_file():
                  raise SystemExit("Screenshot file is missing")
              size = path.stat().st_size
              if not 24 <= size <= 10 * 1024 * 1024:
                  raise SystemExit("Screenshot size is outside the allowed range")
              data = path.read_bytes()[:24]
              if data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise SystemExit("Screenshot is not a valid PNG container")
              expected_files.add(filename)
          if {path.name for path in files} != expected_files:
              raise SystemExit("Artifact contains unexpected files")
          PY

      - name: Validate R2 configuration
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY \
            R2_ACCOUNT_ID \
            R2_BUCKET \
            R2_PUBLIC_BASE_URL
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required R2 configuration: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload screenshots to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          ARTIFACT_DIR: ${{ runner.temp }}/ui-screenshot-artifact
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          object_prefix="pr-${EXPECTED_PR_NUMBER}/${EXPECTED_HEAD_SHA}"
          aws s3 cp "$ARTIFACT_DIR" "s3://${R2_BUCKET}/${object_prefix}/" \
            --recursive \
            --exclude "*" \
            --include "*.png" \
            --content-type "image/png" \
            --endpoint-url "$endpoint" \
            --only-show-errors
          aws s3 cp "$ARTIFACT_DIR/metadata.json" \
            "s3://${R2_BUCKET}/${object_prefix}/metadata.json" \
            --content-type "application/json" \
            --endpoint-url "$endpoint" \
            --only-show-errors

      - name: Update pull request comment
        uses: actions/github-script@v9
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/ui-screenshot-artifact
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        with:
          github-token: ${{ github.token }}
          retries: 3
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = Number(process.env.EXPECTED_PR_NUMBER);
            const headSha = process.env.EXPECTED_HEAD_SHA;
            const artifactDir = process.env.ARTIFACT_DIR;
            const metadata = JSON.parse(fs.readFileSync(path.join(artifactDir, 'metadata.json'), 'utf8'));
            const publicBaseUrl = process.env.R2_PUBLIC_BASE_URL.replace(/\/+$/, '');

            const marker = '<!-- kasane-ui-screenshot-review -->';
            const sections = metadata.screenshots.map((screenshot) => {
              const encodedPath = `pr-${prNumber}/${headSha}/${screenshot.file}`
                .split('/').map(encodeURIComponent).join('/');
              const url = `${publicBaseUrl}/${encodedPath}`;
              return `### ${screenshot.name}\n\n<img src="${url}" width="390">`;
            });
            const body = [
              marker,
              '',
              '## 📱 UI Screenshots',
              '',
              `Generated from \`${headSha.slice(0, 7)}\``,
              '',
              sections.join('\n\n'),
              '',
              `- Simulator: ${metadata.simulator}`,
              `- iOS: ${metadata.ios}`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }
