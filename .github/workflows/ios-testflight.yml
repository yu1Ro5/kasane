name: iOS TestFlight Release

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight-release
  cancel-in-progress: false

jobs:
  archive-and-upload:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ARCHIVE_PATH: build/KASANE.xcarchive
      EXPORT_PATH: build/export
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APPLE_DEVELOPMENT_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Define temporary paths
        shell: bash
        run: |
          echo "API_KEY_PATH=$RUNNER_TEMP/app-store-connect/AuthKey.p8" >> "$GITHUB_ENV"
          echo "EXPORT_OPTIONS_PATH=$RUNNER_TEMP/TestFlightExportOptions.plist" >> "$GITHUB_ENV"

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_BASE64 \
            APPLE_DEVELOPMENT_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          xcode_path="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -1)"
          if [[ -z "$xcode_path" ]]; then
            echo "Xcode 26 was not found on this runner." >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode_path"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Restore App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$(dirname "$API_KEY_PATH")"
          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          try:
              key = base64.b64decode(os.environ["APP_STORE_CONNECT_API_KEY_BASE64"], validate=True)
          except (binascii.Error, ValueError) as error:
              raise SystemExit("APP_STORE_CONNECT_API_KEY_BASE64 is not valid base64") from error
          if not key.strip():
              raise SystemExit("The decoded App Store Connect API key is empty")
          path = Path(os.environ["API_KEY_PATH"])
          path.write_bytes(key)
          path.chmod(0o600)
          PY

      - name: Prepare export options
        shell: bash
        run: |
          set -euo pipefail
          cp Configuration/TestFlightExportOptions.plist "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_DEVELOPMENT_TEAM_ID" "$EXPORT_OPTIONS_PATH"
          plutil -lint "$EXPORT_OPTIONS_PATH"

      - name: Archive KASANE
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project KASANE.xcodeproj \
            -scheme KASANE \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export and upload to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove authentication material
        if: always()
        shell: bash
        run: rm -f "$API_KEY_PATH" "$EXPORT_OPTIONS_PATH"
